name: Validate Docs Site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build runs prepare-docs first (frontmatter validation, search index,
      # EN/AZ parity), and with onBrokenLinks=throw it also gates link integrity.
      - name: Build website
        run: npm run build

      - name: Lint
        run: npm run lint

      # Criticals must never ship. Known high-severity advisories inside the
      # Docusaurus dependency tree (image-size and friends) have no upstream
      # fix yet and are tracked by dependabot; gate on critical only.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
